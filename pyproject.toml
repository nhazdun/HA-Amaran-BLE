[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D", "ASYNC", "BLE"]
ignore = ["D203", "D213", "E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
"custom_components/amaran_ble/amaran/products.py" = ["E501", "RUF001"]
